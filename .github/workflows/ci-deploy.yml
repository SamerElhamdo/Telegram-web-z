name: CI & Private Hosting Release

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_image:
        description: "Build and push container image using GitHub secrets"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Web Z TypeScript & ESLint
        run: npm run check:ts

      - name: Check Web Z CSS
        run: npm run check:css

      - name: Check HeroUI Console & Server TypeScript
        run: npm run check:console && npm run check:server

      - name: Run automated unit & MCP auth tests (mocked, no real Telegram calls)
        run: npm run test:mcp

      - name: Build HeroUI Console
        run: npm run build:console

  container-publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_image == true
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.CONTAINER_REGISTRY }}
          username: ${{ secrets.CONTAINER_REGISTRY_USER }}
          password: ${{ secrets.CONTAINER_REGISTRY_TOKEN }}

      - name: Build and push production container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.CONTAINER_IMAGE_NAME }}:latest,${{ secrets.CONTAINER_IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            TELEGRAM_API_ID=${{ secrets.TELEGRAM_API_ID }}
            TELEGRAM_API_HASH=${{ secrets.TELEGRAM_API_HASH }}
            BASE_URL=${{ secrets.BASE_URL }}
